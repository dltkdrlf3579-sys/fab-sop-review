[fab]
# 사내 FAB 조회 SQL. 여러 줄이면 아래 SELECT 예시처럼 모든 줄을 들여쓰기한다.
# CRE_DTTM은 개정본의 최초등록시각이며 같은 개정본의 모든 작업행에 공통이다.
query =
    SELECT sopr_no, sopr_nm, sopr_main_seq, sopr_main_nm, sopr_sub_seq, sopr_sub_ctnt, CRE_DTTM
    FROM your_fab_sop_view
    WHERE CRE_DTTM >= '{window_start}' AND CRE_DTTM < '{window_end}'
    ORDER BY sopr_no, CRE_DTTM, sopr_main_seq, sopr_sub_seq

lookback_days = 3
row_format = fab_steps
sop_id_column = sopr_no
# 같은 SOP에서 여러 버전의 등록시각이 같을 수 있으면 실제 개정번호 컬럼을 지정한다.
revision_column = CRE_DTTM

[data]
# 기존 execute_SQL(query) -> pandas.DataFrame 어댑터의 모듈명
adapter_module = sql_adapter
# sql_adapter.py가 있는 폴더. 빈 값이면 config.ini가 있는 폴더.
adapter_dir =
# 사내 DB 드라이버를 별도 폴더에 두었을 때만 지정한다.
driver_dir =

[review]
index_path = knowledge_index.jsonl
# 파일명이 바뀌면 실제 색인의 source / 시트명과 맞춘다.
guide_source = 통합 환경안전 SOP 가이드_2026-08-27.xlsx
guide_sheet = 환경안전가이드(FAB)
# 위 가이드에서 다른 작업영역 전용인 시트 이름. 보호구 및 공통 별첨은 포함해 검색합니다.
other_area_sheets = (Infra), (실험실)
# 기본값은 이 파일의 [llm]. 기존 설정을 공유하려면 작업중지권 config.ini 경로를 지정한다.
llm_config =
max_input_chars = 160000
# 하위작업 한 행에서 검색할 BM25 근거의 최대 개수
max_evidence_items = 20
# 한 배치에서 여러 SOP가 공유하는 신규 요청 수 (1~50)
max_concurrent_requests = 50
# 신규 요청과 별도로 사용하는 재시도 자리 (1~10)
max_retry_workers = 10

[llm]
# 작업중지권에서 쓰는 실제 값은 회사 PC의 config.ini에 입력한다.
base_url =
model_name =
x_dep_ticket =
send_system_name =
user_id =
user_type =
# 별도의 Bearer 키가 필요한 사내 API에서만 입력한다.
api_key =
timeout_seconds = 180
# 응답 생성 한도. 비워 두면 요청에서 생략하고 서버 기본값을 사용한다.
max_tokens =

[daily_review]
# 작업중지권 sql_adapter의 iqadb1()으로 접속. 기존 스키마의 SOP 결과 전용 테이블명.
result_history_table = ai_fab_sop_review
auto_create_result_table = true
# 비우면 위 테이블과 같은 스키마에 <테이블명>_latest 뷰를 만든다.
latest_view =

[mail]
# 수신자가 정해진 사내 검토 담당 메일함용. 미설정 시 DB 발송대기 목록까지만 적재.
enabled = false
host =
port = 587
starttls = true
sender =
recipient =
username =
password_env = SOP_SMTP_PASSWORD
